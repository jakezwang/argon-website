name: Website verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run test:releases
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run start -- --hostname 127.0.0.1 --port 13000 > /tmp/website.log 2>&1 &
      - run: |
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:13000 >/dev/null && break; sleep 1; done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true # Screenshots are optional evidence, not a test gate.
        with:
          name: website-screenshots
          path: /tmp/argon-website-checks

  cli-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pymongo>=4.6,<5"
      - name: Install the documented CLI release
        run: |
          VERSION=$(node -p "require('./app/release.json').version")
          npm install -g "argonctl@$VERSION"
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name argon-docs-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0
          for i in $(seq 1 30); do
            docker exec argon-docs-mongo mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec argon-docs-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            docker exec argon-docs-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' && break
            sleep 1
          done
      - run: npm run test:docs
        env:
          ARGON_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - if: always()
        run: docker rm -f argon-docs-mongo
