name: Contributors
# Keeps the About page's list of outside contributors current without anyone
# having to remember. It rebuilds app/contributors.json from the merged pull
# requests of the public Argon repositories and, when someone new has landed
# a change, commits the result to master, which deploys the site.
#
# It runs every hour, and at once when the engine repository reports a merged
# pull request (repository_dispatch) or when started by hand.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [contributors]
permissions: {}

concurrency:
  group: contributors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The token stays in the checkout because the last step pushes. Nothing
      # here installs dependencies: the script only uses Node's standard
      # library, so no third-party code runs with write access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rebuild the list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-contributors.sh
